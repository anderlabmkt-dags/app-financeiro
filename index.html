<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinançasPro | Dashboard Inteligente</title>
    <meta name="description" content="FinançasPro - Dashboard financeiro pessoal inteligente. Gerencie seus gastos, cartões e dívidas em um só lugar." />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <!-- Mobile sidebar toggle -->
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu">
      <span class="material-symbols-rounded">menu</span>
    </button>

    <div id="app" class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="brand flex items-center gap-md">
          <span class="material-symbols-rounded" style="font-size: 32px;">account_balance</span>
          <h1 style="color: white; font-size: 24px;">Finanças<span style="font-weight: 400;">Pro</span></h1>
        </div>
        
        <nav class="flex flex-col gap-sm" id="sidebar-nav">
          <a href="#dashboard" class="nav-link active" data-view="dashboard">
            <span class="material-symbols-rounded">dashboard</span>
            Dashboard
          </a>
          <a href="#cartoes" class="nav-link" data-view="cartoes">
            <span class="material-symbols-rounded">credit_card</span>
            Meus Cartões
          </a>
          <a href="#contas" class="nav-link" data-view="contas">
            <span class="material-symbols-rounded">account_balance</span>
            Contas Bancárias
          </a>
          <a href="#dividas" class="nav-link" data-view="dividas">
            <span class="material-symbols-rounded">account_balance_wallet</span>
            Gestão de Dívidas
          </a>
        </nav>

        <div style="margin-top: auto; padding: var(--spacing-md); background: rgba(255,255,255,0.05); border-radius: var(--radius-lg);">
          <p class="text-muted" style="color: rgba(255,255,255,0.5); font-size: 12px; margin-bottom: 4px;">PLANO ATUAL</p>
          <p style="font-weight: 600; margin-bottom: var(--spacing-sm);">Premium Mensal</p>
          <div class="flex gap-sm">
            <button id="btn-change-access" class="btn-outline btn-sm" style="flex: 1; border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.8);" title="Alterar Acesso">
              <span class="material-symbols-rounded" style="font-size: 16px;">manage_accounts</span>
            </button>
            <button id="btn-logout" class="btn-outline btn-sm" style="flex: 1; border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.8);" title="Sair">
              <span class="material-symbols-rounded" style="font-size: 16px;">logout</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content" id="main-content">
        <!-- Content will be injected here -->
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
