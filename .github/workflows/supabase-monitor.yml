name: Supabase Daily Health Check

on:
  schedule:
    # Executa todos os dias às 00:00 (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite que você execute manualmente pelo painel do GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Usando versão 20 que tem suporte nativo ao fetch

      - name: Executar verificação de saúde do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node supabase-monitor/index.js
